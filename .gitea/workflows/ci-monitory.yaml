env:
  DOCKER_REGISTRY_URL: 192.168.56.12:5000
  DOCKER_IMAGE_NAME: task-manager-monitor

name: Task Manager Monitor Image
run-name: ${{ gitea.actor }} is building the Monitor image
on:
  push:
    branches: [main]
    paths:
      - 'services/monitor/**' # The whole pipeline only runs if this folder changes
  # Also allows manual triggering for demos
  workflow_dispatch:

jobs:

  test-logic:
    runs-on: ubuntu-latest
    
    # 1. Декларираме Redis като услуга (Service container)
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        # Опционално: добавяме healthcheck, за да сме сигурни, че Redis е напълно готов преди тестовете
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Tests
        env:
          # Тъй като услугата се достъпва на localhost, променливата ви остава същата като при ръчен тест!
          REDIS_HOST: 127.0.0.1 
        run: |
          cd services/monitor
          go mod tidy
          go get github.com/stretchr/testify/assert
          go test -v ./...

  build-images:
    needs: test-logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."192.168.56.12:5000"]
              http = true
              insecure = true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY_URL }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 10

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ./services/monitor
          file: ./services/monitor/Dockerfile
          provenance: mode=max
          sbom: true
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
